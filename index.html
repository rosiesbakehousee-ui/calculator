<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rosie's Bakehouse — Cost & Sales Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FAF3E9;
    --cream-2:#F3E9D8;
    --espresso:#2E2119;
    --espresso-soft:#5C4A3D;
    --terracotta:#C1613A;
    --terracotta-dark:#9A4B2C;
    --sage:#7C9473;
    --sage-dark:#5F7856;
    --caramel:#E3A857;
    --line:#E4D8C7;
    --white:#FFFDFA;
    --red:#B5533C;
    --green:#5F7856;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--espresso);font-family:'Inter',sans-serif;}
  h1,h2,h3,.serif{font-family:'Fraunces',serif;}
  ::selection{background:var(--caramel);color:var(--espresso);}

  .app{display:flex;min-height:100vh;}

  /* Sidebar */
  .sidebar{
    width:220px;flex-shrink:0;background:var(--espresso);color:var(--cream);
    padding:28px 18px;display:flex;flex-direction:column;gap:4px;
  }
  .brand{font-size:22px;line-height:1.15;margin-bottom:6px;color:var(--cream);}
  .brand small{display:block;font-family:'Inter',sans-serif;font-size:11px;letter-spacing:.04em;color:var(--caramel);margin-top:4px;font-weight:600;}
  .nav{margin-top:22px;display:flex;flex-direction:column;gap:2px;}
  .nav-btn{
    text-align:left;background:none;border:none;color:#D9CBBB;padding:10px 12px;
    border-radius:8px;font-size:14px;cursor:pointer;font-family:'Inter',sans-serif;font-weight:500;
    display:flex;align-items:center;gap:10px;transition:background .15s;
  }
  .nav-btn:hover{background:rgba(255,255,255,.06);}
  .nav-btn.active{background:var(--terracotta);color:var(--white);}
  .nav-icon{width:18px;text-align:center;font-size:15px;}
  .sidebar-foot{margin-top:auto;font-size:11px;color:#8C7A68;line-height:1.5;}

  /* Main */
  .main{flex:1;padding:30px 40px 60px;max-width:1180px;}
  .statbar{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:30px;}
  .stat{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:16px 18px;}
  .stat .label{font-size:12px;color:var(--espresso-soft);font-weight:500;}
  .stat .value{font-family:'Fraunces',serif;font-size:24px;margin-top:4px;}
  .stat.pos .value{color:var(--sage-dark);}
  .stat.neg .value{color:var(--red);}

  .page-title{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px;}
  .page-title h1{font-size:28px;margin:0;font-weight:600;}
  .page-sub{color:var(--espresso-soft);font-size:14px;margin-bottom:26px;}

  .card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:22px 24px;margin-bottom:20px;}
  .card h3{margin:0 0 14px;font-size:17px;font-weight:600;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;color:var(--espresso-soft);font-weight:600;font-size:12px;text-transform:none;
     border-bottom:1px solid var(--line);padding:8px 10px;}
  td{padding:8px 10px;border-bottom:1px solid #F0E7D8;}
  tr:last-child td{border-bottom:none;}
  tr.total-row td{font-weight:700;border-top:2px solid var(--espresso);border-bottom:none;padding-top:12px;}
  tr.year-row td{background:var(--cream-2);font-family:'Fraunces',serif;font-weight:600;font-size:14px;color:var(--terracotta-dark);padding:8px 10px;border-bottom:1px solid var(--line);}
  .num{text-align:right;font-variant-numeric:tabular-nums;}

  input,select{
    font-family:'Inter',sans-serif;font-size:13.5px;padding:7px 9px;border:1px solid var(--line);
    border-radius:7px;background:var(--white);color:var(--espresso);width:100%;
  }
  input:focus,select:focus{outline:2px solid var(--caramel);outline-offset:1px;}
  input[type=number]{text-align:right;}

  .btn{
    font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;padding:9px 16px;border-radius:8px;
    border:none;cursor:pointer;transition:opacity .15s;
  }
  .btn:hover{opacity:.88;}
  .btn-primary{background:var(--terracotta);color:var(--white);}
  .btn-secondary{background:var(--cream-2);color:var(--espresso);}
  .btn-ghost{background:none;color:var(--terracotta-dark);padding:6px 8px;}
  .btn-danger{background:none;color:var(--red);padding:6px 8px;}
  .btn-sm{padding:5px 10px;font-size:12.5px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  .row{display:flex;gap:10px;align-items:center;}
  .grow{flex:1;}
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
  .field label{font-size:12.5px;font-weight:600;color:var(--espresso-soft);}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .field-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}

  .pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--cream-2);color:var(--espresso-soft);}
  .pill-discount{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:#FBEEDD;color:var(--terracotta-dark);margin-left:6px;white-space:nowrap;}
  tr.discount-row{background:#FEFAF3;}
  .empty{color:var(--espresso-soft);font-size:13.5px;padding:20px 4px;text-align:center;}

  .ingredient-line{display:grid;grid-template-columns:2.2fr 1fr 1fr 32px;gap:10px;margin-bottom:8px;align-items:center;}
  .ingredient-line .cost{font-size:13px;color:var(--espresso-soft);text-align:right;}
  .qty-with-unit{position:relative;display:flex;align-items:center;}
  .qty-with-unit input{padding-right:30px;}
  .qty-with-unit .unit-suffix{position:absolute;right:9px;font-size:12px;color:var(--espresso-soft);font-weight:600;pointer-events:none;}
  .cost-summary{background:var(--cream-2);border-radius:10px;padding:16px 18px;margin-top:16px;}
  .cost-summary .line{display:flex;justify-content:space-between;font-size:13.5px;padding:4px 0;}
  .cost-summary .line.total{font-weight:700;font-size:15px;border-top:1px solid var(--line);margin-top:6px;padding-top:10px;}
  .cost-summary .line.sale{color:var(--terracotta-dark);font-weight:700;font-size:16px;}

  .tab-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
  .search{max-width:260px;}

  .recipe-card{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;background:var(--white);
    display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .recipe-card:hover{border-color:var(--terracotta);}
  .recipe-card .name{font-weight:600;font-size:14.5px;}
  .recipe-card .meta{font-size:12.5px;color:var(--espresso-soft);margin-top:2px;}
  .recipe-card .price{font-family:'Fraunces',serif;font-size:18px;color:var(--terracotta-dark);}

  .badge-margin{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;}
  .badge-margin.good{background:#E4EEDF;color:var(--sage-dark);}
  .badge-margin.low{background:#FBEAE3;color:var(--red);}

  .modal-bg{position:fixed;inset:0;background:rgba(46,33,25,.45);display:flex;align-items:center;justify-content:center;z-index:50;}
  .modal{background:var(--white);border-radius:14px;padding:26px 28px;width:440px;max-width:92vw;max-height:88vh;overflow:auto;}
  .modal.wide{width:520px;}
  .dropzone{border:2px dashed var(--line);border-radius:10px;padding:26px;text-align:center;cursor:pointer;color:var(--espresso-soft);font-size:13.5px;}
  .dropzone:hover{border-color:var(--terracotta);}
  .dropzone img{max-width:100%;max-height:180px;border-radius:8px;}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--terracotta);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .notice{background:var(--cream-2);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--espresso-soft);margin-bottom:14px;}
  .notice.warn{background:#FBEAE3;color:var(--red);}

  select.status-select{font-size:12px;padding:4px 6px;}
  .loading{padding:60px;text-align:center;color:var(--espresso-soft);font-size:14px;}
  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

  @media (max-width:800px){
    .app{flex-direction:column;}
    .sidebar{width:100%;flex-direction:row;overflow-x:auto;padding:14px;}
    .brand{display:none;}
    .nav{flex-direction:row;margin-top:0;}
    .main{padding:20px;}
    .statbar{grid-template-columns:repeat(2,1fr);}
    .field-row,.field-row3{grid-template-columns:1fr;}
  }
</style>
</head>

<script>
// ---------- Storage backend: Claude's window.storage when available, localStorage otherwise ----------
// This lets the exact same file work both as a Claude artifact and as a standalone
// page hosted or opened anywhere else.
const LS_PREFIX = 'rosiesBakehouseCalc_';
const hasClaudeStorage = (typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function');

const localStorageBackend = {
  async get(key){
    try{
      const raw = window.localStorage.getItem(LS_PREFIX+key);
      return raw===null ? null : { key, value: raw };
    }catch(e){ throw e; }
  },
  async set(key, value){
    window.localStorage.setItem(LS_PREFIX+key, value);
    return { key, value };
  },
  async delete(key){
    window.localStorage.removeItem(LS_PREFIX+key);
    return { key, deleted:true };
  }
};
const storageBackend = hasClaudeStorage ? window.storage : localStorageBackend;

// ---------- Optional cloud sync (Firebase Realtime Database) so data follows you across devices ----------
function loadCloudConfig(){
  try{
    const raw = window.localStorage.getItem(LS_PREFIX+'cloudConfig');
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveCloudConfig(cfg){
  try{
    if(cfg) window.localStorage.setItem(LS_PREFIX+'cloudConfig', JSON.stringify(cfg));
    else window.localStorage.removeItem(LS_PREFIX+'cloudConfig');
  }catch(e){ /* ignore */ }
}
let cloudConfig = loadCloudConfig();

function cloudDataUrl(cfg){
  return `${cfg.databaseURL}/rosiesBakehouse/${encodeURIComponent(cfg.code)}.json`;
}
async function fetchWithTimeout(url, options={}, timeoutMs=12000){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), timeoutMs);
  try{
    return await fetch(url, {...options, signal: controller.signal});
  }catch(e){
    if(e.name==='AbortError') throw new Error('timed out — check your internet connection');
    throw e;
  }finally{
    clearTimeout(timer);
  }
}
async function cloudFetchBundle(cfg){
  const res = await fetchWithTimeout(cloudDataUrl(cfg));
  if(!res.ok) throw new Error('HTTP '+res.status+' — check your database URL');
  const data = await res.json();
  return data || {};
}
async function cloudPushBundle(cfg, bundle){
  const res = await fetchWithTimeout(cloudDataUrl(cfg), {
    method:'PUT',
    headers: { 'Content-Type':'application/json' },
    body: JSON.stringify(bundle)
  });
  if(!res.ok) throw new Error('HTTP '+res.status+' — check your database URL');
}

let cloudBundle = null; // in-memory cache of the whole synced record, once fetched
let cloudBundlePromise = null; // in-flight fetch, shared so concurrent calls don't each trigger their own request
let cloudLoadError = null;
function getCloudBundle(){
  if(cloudBundlePromise===null){
    cloudBundlePromise = cloudFetchBundle(cloudConfig)
      .then(b=>{ cloudBundle=b; cloudLoadError=null; return b; })
      .catch(e=>{ cloudBundlePromise=null; cloudLoadError=e; throw e; }); // reset so a later retry can fetch again
  }
  return cloudBundlePromise;
}
const cloudBackend = {
  async get(key){
    const bundle = await getCloudBundle();
    return (key in bundle) ? { key, value: JSON.stringify(bundle[key]) } : null;
  },
  async set(key, valueStr){
    const bundle = await getCloudBundle();
    bundle[key] = JSON.parse(valueStr);
    await cloudPushBundle(cloudConfig, bundle);
    return { key, value: valueStr };
  }
};

const activeBackend = cloudConfig ? cloudBackend : storageBackend;

// ---------- Storage helpers ----------
async function loadKey(key, fallback){
  try{
    const r = await activeBackend.get(key, false);
    return r ? JSON.parse(r.value) : fallback;
  }catch(e){ return fallback; }
}
async function saveKey(key, value){
  try{
    const r = await activeBackend.set(key, JSON.stringify(value), false);
    if(!r) throw new Error('storage returned no result');
    return true;
  }catch(e){
    console.error('save failed', key, e);
    await modalAlert(`Couldn't save your changes to ${key} just now (${(e&&e.message)||'unknown error'}). Try again — if it keeps happening, use Export data in Settings to back up what you have.`);
    return false;
  }
}

// ---------- Custom modal dialogs (native confirm()/alert() are blocked in this sandboxed view) ----------
function modalConfirm(message, confirmText='Yes, continue'){
  return new Promise(resolve=>{
    const id = 'dlg-' + uid('c');
    document.body.insertAdjacentHTML('beforeend', `
      <div class="modal-bg" id="${id}">
        <div class="modal" style="width:380px;">
          <div style="font-size:14px;line-height:1.5;margin-bottom:18px;">${message}</div>
          <div class="row" style="justify-content:flex-end;">
            <button class="btn btn-secondary" id="${id}-cancel">Cancel</button>
            <button class="btn btn-primary" id="${id}-ok">${confirmText}</button>
          </div>
        </div>
      </div>
    `);
    const cleanup = (val)=>{ const el=document.getElementById(id); if(el) el.remove(); resolve(val); };
    document.getElementById(id+'-cancel').addEventListener('click', ()=>cleanup(false));
    document.getElementById(id+'-ok').addEventListener('click', ()=>cleanup(true));
    document.getElementById(id).addEventListener('click', (e)=>{ if(e.target.id===id) cleanup(false); });
  });
}
function modalAlert(message){
  return new Promise(resolve=>{
    const id = 'dlg-' + uid('a');
    document.body.insertAdjacentHTML('beforeend', `
      <div class="modal-bg" id="${id}">
        <div class="modal" style="width:360px;">
          <div style="font-size:14px;line-height:1.5;margin-bottom:18px;">${message}</div>
          <div class="row" style="justify-content:flex-end;">
            <button class="btn btn-primary" id="${id}-ok">OK</button>
          </div>
        </div>
      </div>
    `);
    const cleanup = ()=>{ const el=document.getElementById(id); if(el) el.remove(); resolve(); };
    document.getElementById(id+'-ok').addEventListener('click', cleanup);
    document.getElementById(id).addEventListener('click', (e)=>{ if(e.target.id===id) cleanup(); });
  });
}

// ---------- Default settings ----------
const DEFAULT_SETTINGS = {
  electricity: {
    wattage: 1400,     // watts drawn by the oven/appliance
    costPerKwh: 12     // ₹ per kWh from your electricity bill
  },
  rates: {
    manpower: 300,        // per hour
    packaging: 50,        // per piece
    parchment: 10,        // per piece
    transport: 10         // per km
  },
  defaultMargin: 30
};
const OTHER_COST_DEFS = [
  { key:'electricity', label:'Electricity', unit:'hour' },
  { key:'manpower',    label:'Manpower',    unit:'hour' },
  { key:'packaging',   label:'Packaging',   unit:'piece' },
  { key:'parchment',   label:'Parchment paper', unit:'piece' },
  { key:'transport',   label:'Transportation', unit:'km' },
];
// Electricity cost per hour used is derived from wattage and the per-kWh rate,
// not stored directly: (watts / 1000) x hours x cost-per-kWh = cost for that
// many hours. Every other "other cost" is still just a flat rate per unit.
function getRate(type){
  if(type==='electricity'){
    const e = STATE.settings.electricity || DEFAULT_SETTINGS.electricity;
    return (e.wattage/1000) * e.costPerKwh;
  }
  return STATE.settings.rates[type] ?? 0;
}

// Standard batch sizes to keep sizing consistent across the menu. "Custom" falls
// back to a free qty+unit entry for anything that doesn't fit one of these.
const STANDARD_YIELDS = [
  { label:'250 g',    qty:250,  unit:'g' },

const uid = (p) => p + '_' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const inr = (n) => '₹' + (Math.round((n||0)*100)/100).toLocaleString('en-IN',{maximumFractionDigits:2});
const round2 = (n) => Math.round((n||0)*100)/100;

// ---------- Global state ----------
let STATE = {
  materials: [],
  settings: DEFAULT_SETTINGS,
  recipes: [],
  sales: [],
  purchases: [],
  tab: 'recipes',
};

async function init(){
  if(cloudConfig){
    const el = document.getElementById('root');
    if(el) el.textContent = 'Fetching your synced data…';
  }
  const [materials, settings, recipes, sales, purchases] = await Promise.all([
    loadKey('materials', window.__MATERIALS_SEED__),
    loadKey('settings', DEFAULT_SETTINGS),
    loadKey('recipes', []),
    loadKey('sales', []),
    loadKey('purchases', []),
  ]);
  STATE.materials = materials;
  STATE.settings = settings;
  STATE.recipes = recipes;
  STATE.sales = sales;
  STATE.purchases = purchases;
  if(!materials || materials.length===0){
    if(cloudConfig){
      // Never auto-seed-and-save over a connected cloud workspace: an empty read
      // here could mean the fetch genuinely failed (network hiccup, timeout) rather
      // than the workspace really being empty, and saving would overwrite real data
      // with the blank default list. Just show what we have and say why, if we know.
      if(cloudLoadError){
        await modalAlert(`Couldn't load your synced data (${cloudLoadError.message||'unknown error'}). Your data in the cloud hasn't been touched — try reloading the page. Showing an empty view for now.`);
      }
    } else {
      STATE.materials = window.__MATERIALS_SEED__;
      await saveKey('materials', STATE.materials);
    }
  }
  render();
}

// ---------- Derived calc helpers ----------
function materialById(id){ return STATE.materials.find(m=>m.id===id); }

function computeRecipeCost(recipe){
  let ingCost = 0;
  (recipe.ingredients||[]).forEach(line=>{
    const m = materialById(line.materialId);
    if(m) ingCost += (line.qty||0) * m.unitCost;
  });
  let otherCost = 0;
  (recipe.otherCosts||[]).forEach(line=>{
    const rate = getRate(line.type);
    otherCost += (line.qty||0) * rate;
  });
  const totalCost = ingCost + otherCost;
  const margin = recipe.margin ?? STATE.settings.defaultMargin;
  const suggestedPrice = margin >= 100 ? totalCost*2 : totalCost / (1 - margin/100);
  return { ingCost, otherCost, totalCost, suggestedPrice, margin };
}

// For a sale covering only part of a recipe's batch (e.g. selling 500g out of a
// 1kg batch), only the ingredient cost should scale down with the portion sold —
// electricity, manpower, packaging, and parchment were spent producing the whole
// batch regardless of how much of it any single sale covers, so they're counted
// at their full recipe value on every sale, not shrunk proportionally.
function saleCostAndSuggested(recipe, qty){
  const c = computeRecipeCost(recipe);
  const cost = round2(c.ingCost * qty + c.otherCost);
  const suggested = c.margin >= 100 ? cost*2 : cost / (1 - c.margin/100);
  return { cost, suggested: round2(suggested) };
}

// A sale logged with the current form stores the actual total price/cost for
// that specific transaction (already reflecting the units sold). Older sales
// (logged before this fix) stored a per-unit price/cost instead, needing a
// multiply by qty — saleRevenue/saleCost/saleReference below read either
// correctly, so past sales keep showing the same numbers they always did.
function saleRevenue(s){
  return s.totalsPreComputed ? (s.price||0) : (s.qty||0)*(s.price||0);
}
function saleCost(s){
  return s.totalsPreComputed ? (s.cost||0) : (s.qty||0)*(s.costPerUnit||0);
}
function saleReferencePrice(s){
  if(s.totalsPreComputed) return s.suggestedPriceAtSale;
  if(s.suggestedPriceAtSale!==undefined) return s.suggestedPriceAtSale * (s.qty||0);
  const rec = STATE.recipes.find(r=>r.id===s.recipeId);
  return rec ? computeRecipeCost(rec).suggestedPrice * (s.qty||0) : undefined;
}

// A human-readable amount for the "Units" column — "500 g" for a standard size,
// or a reconstructed "437 g" / "150 ml" / "3 pieces" for a custom amount, so the
// log never shows a bare fraction like 0.4. Only falls back to a raw ratio when
// the sale's recipe has no batch size on record at all to convert against.
function saleQuantityLabel(s){
  if(s.portionLabel) return s.portionLabel;
  const rec = STATE.recipes.find(r=>r.id===s.recipeId);
  if(rec && rec.yieldQty && rec.yieldUnit){
    let amount;
    if(rec.yieldUnit==='kg') amount = (s.qty||0) * rec.yieldQty * 1000; // display weight custom amounts in grams
    else amount = (s.qty||0) * rec.yieldQty;
    const rounded = Math.round(amount);
    if(rec.yieldUnit==='piece') return `${rounded} ${rounded===1?'piece':'pieces'}`;
    if(rec.yieldUnit==='ml') return `${rounded} ml`;
    return `${rounded} g`;
  }
  return `${s.qty} unit(s)`;
}

function salesTotals(){
  let revenue=0, cost=0;
  STATE.sales.forEach(s=>{
    revenue += saleRevenue(s);
    cost += saleCost(s);
  });
  const profit = revenue-cost;
  const marginPct = revenue>0 ? (profit/revenue*100) : 0;
  return {revenue, cost, profit, marginPct};
}

// Converts a sale's qty ratio into a real amount (grams/ml/pieces) using its
// recipe's batch size, for aggregating "units sold" without falling back to a
// bare fraction — mirrors saleQuantityLabel's conversion but returns a number.
function saleAmountForAggregation(s){
  const rec = STATE.recipes.find(r=>r.id===s.recipeId);
  if(rec && rec.yieldQty && rec.yieldUnit){
    if(rec.yieldUnit==='kg') return { amount: (s.qty||0)*rec.yieldQty*1000, unit:'g' };
    return { amount: (s.qty||0)*rec.yieldQty, unit: rec.yieldUnit };
  }
  return null;
}
function formatAggregatedAmount(group){
  if(group.unit && !group.mixedOrUnknown){
    const rounded = Math.round(group.amount);
    if(group.unit==='piece') return `${rounded} ${rounded===1?'piece':'pieces'}`;
    if(group.unit==='ml') return `${rounded} ml`;
    return `${rounded} g`;
  }
  return `${Math.round(group.qty*100)/100} unit(s)`;
}

function perProductSummary(){
  const map = {};
  STATE.sales.forEach(s=>{
    if(!map[s.recipeName]) map[s.recipeName] = {name:s.recipeName, qty:0, revenue:0, cost:0, amount:0, unit:null, mixedOrUnknown:false};
    const g = map[s.recipeName];
    g.qty += s.qty||0;
    g.revenue += saleRevenue(s);
    g.cost += saleCost(s);
    const conv = saleAmountForAggregation(s);
    if(conv && (g.unit===null || g.unit===conv.unit)){
      g.unit = conv.unit;
      g.amount += conv.amount;
    } else {
      g.mixedOrUnknown = true;
    }
  });
  return Object.values(map).map(r=>({...r, profit:r.revenue-r.cost}))
    .sort((a,b)=>b.revenue-a.revenue);
}

}

function openMaterialModal(m){
  document.body.insertAdjacentHTML('beforeend', materialModalHTML(m));
  const updatePreview = ()=>{
    const q = parseFloat(document.getElementById('mf-packqty').value)||0;
    const p = parseFloat(document.getElementById('mf-packmrp').value)||0;
    document.getElementById('mf-unitcost-preview').value = q>0 ? inr(p/q) : '₹0';
  };
  document.getElementById('mf-packqty').addEventListener('input', updatePreview);
  document.getElementById('mf-packmrp').addEventListener('input', updatePreview);
  updatePreview();
  document.getElementById('ing-cancel').addEventListener('click', closeModal);
  document.getElementById('ing-modal-bg').addEventListener('click', (e)=>{ if(e.target.id==='ing-modal-bg') closeModal(); });
  document.getElementById('ing-save').addEventListener('click', async ()=>{
    const name = document.getElementById('mf-name').value.trim();
    if(!name){ await modalAlert('Give it a name first.'); return; }
    const packQty = parseFloat(document.getElementById('mf-packqty').value)||1;
    const packMrp = parseFloat(document.getElementById('mf-packmrp').value)||0;
    const data = {
      name,
      category: document.getElementById('mf-cat').value,
      unit: document.getElementById('mf-unit').value,
      packQty, packMrp,
      unitCost: Math.round((packMrp/packQty)*10000)/10000,
    };
    const id = document.getElementById('ing-save').dataset.id;
    if(id){
      const idx = STATE.materials.findIndex(x=>x.id===id);
      STATE.materials[idx] = {...STATE.materials[idx], ...data};
    } else {
      STATE.materials.push({id: uid('m'), ...data});
    }
    await saveKey('materials', STATE.materials);
    closeModal();
    render();
  });
}
function closeModal(){
  const el = document.getElementById('ing-modal-bg') || document.getElementById('generic-modal-bg');
  if(el) el.remove();
}

  if(!rec.yieldQty || !rec.yieldUnit) return '';
  let basis, label;
  if(rec.yieldUnit==='g' || rec.yieldUnit==='kg'){
    const grams = rec.yieldUnit==='kg' ? rec.yieldQty*1000 : rec.yieldQty;
    basis = suggestedPrice / (grams/100);
    label = 'Price per 100 g';
  } else if(rec.yieldUnit==='ml'){
    basis = suggestedPrice / (rec.yieldQty/100);
    label = 'Price per 100 ml';
  } else {
    basis = suggestedPrice / rec.yieldQty;
    label = 'Price per piece';
  }
  return `<div class="line"><span>${label}</span><span>${inr(basis)}</span></div>`;
}

function recipeSummaryHTML(rec){
  const c = computeRecipeCost(rec);
  return `
    <div class="line"><span>Ingredient cost</span><span>${inr(c.ingCost)}</span></div>
    <div class="line"><span>Other costs</span><span>${inr(c.otherCost)}</span></div>
    <div class="line total"><span>Total cost price</span><span>${inr(c.totalCost)}</span></div>
    <div class="line sale"><span>Suggested sale price (${c.margin}% margin)</span><span>${inr(c.suggestedPrice)}</span></div>
    <div class="line"><span>Profit per unit</span><span>${inr(c.suggestedPrice-c.totalCost)}</span></div>
    ${perStandardUnitLine(rec, c.suggestedPrice)}
  `;
}

function readRecipeFromForm(){
  const ingredients = [...document.querySelectorAll('.ri-material')].map((sel,idx)=>{
    const qtyInput = document.querySelector(`.ri-qty[data-i="${sel.dataset.i}"]`);
    return { materialId: sel.value, qty: parseFloat(qtyInput.value)||0 };
  });
  const otherCosts = [...document.querySelectorAll('.ro-type')].map((sel)=>{
    const qtyInput = document.querySelector(`.ro-qty[data-i="${sel.dataset.i}"]`);
    return { type: sel.value, qty: parseFloat(qtyInput.value)||0 };
  });
  const margin = parseFloat(document.getElementById('rc-margin').value) || 0;
  const name = document.getElementById('rc-name').value.trim();
  const yieldQty = parseFloat(document.getElementById('rc-yield-qty').value) || null;
  const yieldUnit = document.getElementById('rc-yield-unit').value;
  return { name, ingredients, otherCosts, margin, yieldQty, yieldUnit };
}

function refreshSummary(){
  const draft = readRecipeFromForm();
  document.getElementById('rc-summary').innerHTML = recipeSummaryHTML(draft);
}

      const qty = parseFloat(qtyInput.value)||0;
      line.querySelector('.cost').textContent = inr(qty*rate);
      refreshSummary();
    });

  document.querySelectorAll('.ro-qty').forEach(el=>{
    el.addEventListener('input', ()=>{

async function importRecipesFromSheet(){
  const existingNames = new Set(STATE.recipes.map(r=>r.name.trim().toLowerCase()));
  const toAdd = (window.__RECIPES_SEED__||[]).filter(r=> !existingNames.has(r.name.trim().toLowerCase()));

}

function formatDDMM(dateStr){
  if(!dateStr) return '—';
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d)) return dateStr;
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  return `${dd}-${mm}`;
}

// Builds the sales log's table rows with a year divider inserted whenever the
// year changes, so the year is shown once per group instead of on every row —
// dates within a group just show as dd-mm.
function salesTableRowsHtml(sorted){
  let html = '';
  let lastYear = null;
  sorted.forEach(s=>{
    const year = s.date ? s.date.slice(0,4) : null;
    if(year !== lastYear){
      lastYear = year;
      html += `<tr class="year-row"><td colspan="9">${year || 'Undated'}</td></tr>`;
    }
    const revenue = saleRevenue(s), cost = saleCost(s), profit = revenue-cost;
    const referencePrice = saleReferencePrice(s);
    // A sale within ₹1 of the suggested price is just rounding to a whole
    // rupee, not a real discount — only flag when the gap is a full rupee or more.
    const isDiscounted = referencePrice!==undefined && (referencePrice - revenue) >= 1;
    html += `<tr data-id="${s.id}" ${isDiscounted?'class="discount-row"':''}>
      <td>${formatDDMM(s.date)}</td>
      <td>${s.recipeName}</td>
      <td>${s.client||'—'}</td>
      <td class="num">${saleQuantityLabel(s)}</td>
      <td class="num">${inr(revenue)} ${isDiscounted?'<span class="pill-discount" title="Below the suggested price of '+inr(referencePrice)+' for '+saleQuantityLabel(s)+'">Discounted</span>':''}</td>
      <td class="num">${inr(cost)}</td>
      <td class="num" style="color:${profit>=0?'var(--sage-dark)':'var(--red)'};font-weight:600;">${inr(profit)}</td>
      <td><span class="pill">${s.payStatus||'—'}</span></td>
      <td>
        <button class="btn-ghost btn-sm edit-sale" data-id="${s.id}">Edit</button>
        <button class="btn-danger btn-sm del-sale" data-id="${s.id}">×</button>
      </td>
    </tr>`;
  });
  return html || `<tr><td colspan="9" class="empty">No sales logged yet.</td></tr>`;
}

function attachSalesHandlers(){
  const recipeSel = document.getElementById('sl-recipe');
  const priceInput = document.getElementById('sl-price');
  const costInput = document.getElementById('sl-cost');
  const costLabel = document.getElementById('sl-cost-label');
  const hint = document.getElementById('sl-hint');
  const qtyControl = document.getElementById('sl-qty-control');
  const customNameInput = document.getElementById('sl-custom-name');

  function isCustomMode(){ return recipeSel.value==='__custom__'; }

  function toggleCustomNameField(){
    customNameInput.style.display = isCustomMode() ? 'block' : 'none';
  }

  function toGrams(qty, unit){ return unit==='kg' ? qty*1000 : qty; }

  // Which standardized portion sizes make sense for this recipe's own unit family.
  // Weight-based recipes (g/kg) get weight presets; piece-based get piece presets;
  // ml-based recipes have no standard presets yet, so they always use direct entry.
  function portionOptionsForRecipe(rec){
    if(!rec || !rec.yieldQty || !rec.yieldUnit) return null;
    if(rec.yieldUnit==='g' || rec.yieldUnit==='kg') return STANDARD_YIELDS.filter(p=>p.unit==='g'||p.unit==='kg');
    if(rec.yieldUnit==='piece') return STANDARD_YIELDS.filter(p=>p.unit==='piece');
    return null;
  }

  function qtyRatioFromPortion(rec, presetQty, presetUnit){
    if(rec.yieldUnit==='piece') return presetQty / rec.yieldQty;
    return toGrams(presetQty, presetUnit) / toGrams(rec.yieldQty, rec.yieldUnit);
  }

  // Custom entry is always in the recipe's own natural unit — grams for a weight
  // recipe (never kg, for finer-grained entry), pieces for a piece recipe, ml for
  // an ml recipe — converted to the qty ratio the rest of the app already uses.
  function qtyRatioFromCustomAmount(rec, amount){
    if(rec.yieldUnit==='piece' || rec.yieldUnit==='ml') return amount / rec.yieldQty;
    return amount / toGrams(rec.yieldQty, rec.yieldUnit);
  }
  function customAmountFromRatio(rec, qty){
    if(!rec || !rec.yieldQty) return '';
    if(rec.yieldUnit==='piece' || rec.yieldUnit==='ml') return qty * rec.yieldQty;
    return qty * toGrams(rec.yieldQty, rec.yieldUnit);
  }
  function customFieldLabel(rec){
    if(rec.yieldUnit==='piece') return 'Pieces sold, e.g. 3';
    if(rec.yieldUnit==='ml') return 'ml sold, e.g. 150';
    return 'Grams sold, e.g. 400';
  }

  // Rebuilds the "units / portion sold" control to match whichever recipe is picked.
  // Weight/piece recipes get a dropdown of standard sizes plus "Custom…" (which asks
  // for the actual grams/pieces sold, not a fraction). ml recipes — no standard sizes
  // exist for those yet — always show a direct "ml sold" entry. Recipes with no batch
  // size set at all fall back to a plain fraction-of-batch entry, since there's no
  // reference amount to convert against. Always leaves a #sl-qty input somewhere in
  // the DOM (hidden when a size-based entry is active) holding the actual ratio, so
  // the rest of the form can keep reading it the same way regardless of which mode.
  function renderPortionControl(){
    toggleCustomNameField();
    if(isCustomMode()){
      qtyControl.innerHTML = `
        <div class="qty-with-unit">
          <input type="number" step="any" id="sl-qty" placeholder="e.g. 1" value="1">
        </div>
        <select id="sl-custom-unit" style="margin-top:8px;">
          <option value="kg">kg</option>
          <option value="g">grams</option>
          <option value="ml">ml</option>
          <option value="piece">pieces</option>
        </select>
      `;
      document.getElementById('sl-qty').addEventListener('input', recomputeLiveSuggestion);
      document.getElementById('sl-custom-unit').addEventListener('change', recomputeLiveSuggestion);
      costInput.disabled = false;
      costLabel.textContent = 'Estimated cost for this sale (₹)';
      costInput.placeholder = 'Enter your estimate';
      recomputeLiveSuggestion();
      return;
    }
    costInput.disabled = true;
    costLabel.textContent = 'Cost for this sale (₹, auto)';
    costInput.placeholder = '';

    const rec = STATE.recipes.find(r=>r.id===recipeSel.value);

    if(rec && rec.yieldQty && rec.yieldUnit==='ml'){
      qtyControl.innerHTML = `
        <input type="number" step="any" id="sl-qty-custom" placeholder="${customFieldLabel(rec)}">
        <input type="hidden" id="sl-qty" value="">
      `;
      const customInput = document.getElementById('sl-qty-custom');
      const qtyInput = document.getElementById('sl-qty');
      // Default to the recipe's own whole batch, so the price shown before you
      // touch anything is "your set price," not a blank or an arbitrary guess.
      customInput.value = round2(rec.yieldQty);
      qtyInput.value = 1;
      customInput.addEventListener('input', ()=>{
        const amt = parseFloat(customInput.value)||0;
        qtyInput.value = Math.round(qtyRatioFromCustomAmount(rec, amt)*10000)/10000;
        recomputeLiveSuggestion();
      });
      recomputeLiveSuggestion();
      return;
    }

    const options = portionOptionsForRecipe(rec);
    if(!options){
      qtyControl.innerHTML = `<input type="number" step="any" id="sl-qty" placeholder="e.g. 1 or 0.5" value="1">`;
      document.getElementById('sl-qty').addEventListener('input', recomputeLiveSuggestion);
      recomputeLiveSuggestion();
      return;
    }
    qtyControl.innerHTML = `
      <select id="sl-portion-preset">
        <option value="">Select a size…</option>
        ${options.map(p=>`<option value="${p.qty}|${p.unit}">${p.label}</option>`).join('')}
        <option value="custom">Custom…</option>
      </select>
      <div id="sl-qty-custom-row" style="display:none;margin-top:8px;">
        <input type="number" step="any" id="sl-qty-custom" placeholder="${customFieldLabel(rec)}">
        <input type="hidden" id="sl-qty" value="">
      </div>
    `;
    const presetSel = document.getElementById('sl-portion-preset');
    const customRow = document.getElementById('sl-qty-custom-row');
    const qtyInput = document.getElementById('sl-qty');
    const customInput = document.getElementById('sl-qty-custom');

    // Default to the recipe's own whole batch — a matching standard size if it
    // has one, otherwise Custom pre-filled with the recipe's actual batch amount.
    // Either way the price shown before you touch anything is "your set price."
    const matchingPreset = options.find(p=>p.qty===rec.yieldQty && p.unit===rec.yieldUnit);
    if(matchingPreset){
      presetSel.value = `${matchingPreset.qty}|${matchingPreset.unit}`;
      qtyInput.value = 1;
    } else {
      presetSel.value = 'custom';
      customRow.style.display = 'block';
      customInput.value = round2(rec.yieldUnit==='kg' ? rec.yieldQty*1000 : rec.yieldQty);
      qtyInput.value = 1;
    }

    presetSel.addEventListener('change', ()=>{
      if(presetSel.value==='custom'){
        customRow.style.display = 'block';
        qtyInput.value = customInput.value ? Math.round(qtyRatioFromCustomAmount(rec, parseFloat(customInput.value)||0)*10000)/10000 : '';
      } else if(presetSel.value===''){
        customRow.style.display = 'none';
        qtyInput.value = '';
      } else {
        customRow.style.display = 'none';
        const [pq, pu] = presetSel.value.split('|');
        qtyInput.value = Math.round(qtyRatioFromPortion(rec, parseFloat(pq), pu)*10000)/10000;
      }
      recomputeLiveSuggestion();
    });
    customInput.addEventListener('input', ()=>{
      const amt = parseFloat(customInput.value)||0;
      qtyInput.value = Math.round(qtyRatioFromCustomAmount(rec, amt)*10000)/10000;
      recomputeLiveSuggestion();
    });
    recomputeLiveSuggestion();
  }

  // Recompute the live suggestion whenever the recipe or the quantity changes.
  // The suggested price only overwrites what's in the price box if the box still
  // holds the last suggestion (or is empty) — once you type your own number, it's
  // left alone even if you then tweak the quantity, so your actual price sticks.
  function recomputeLiveSuggestion(){
    if(isCustomMode()){
      hint.textContent = 'Custom item — nothing is calculated automatically here; enter your own estimated cost and the price you charged.';
      return;
    }
    const rec = STATE.recipes.find(r=>r.id===recipeSel.value);
    const qtyInput = document.getElementById('sl-qty');
    const qty = parseFloat(qtyInput.value)||0;
    if(!rec){
      costInput.value=''; priceInput.value=''; priceInput.dataset.suggested='';
      hint.textContent = '';
      return;
    }
    const sc = saleCostAndSuggested(rec, qty);
    const suggestedTotal = sc.suggested;
    const costTotal = sc.cost;
    const priceUntouched = priceInput.value==='' || parseFloat(priceInput.value)===parseFloat(priceInput.dataset.suggested||'NaN');
    if(priceUntouched) priceInput.value = suggestedTotal;
    priceInput.dataset.suggested = suggestedTotal;
    costInput.value = inr(costTotal);

    const presetSel = document.getElementById('sl-portion-preset');
    // "Your set price" applies whenever this is exactly the recipe's own whole
    // batch (qty ratio of 1) — regardless of whether that happened to line up
    // with a standard preset or the recipe's own batch size is a custom amount.
    // Anything else (a different size, a partial amount) is an estimate.
    const isWholeBatch = Math.abs(qty-1) < 0.0001;
    let sizeDescription;
    if(isWholeBatch){
      sizeDescription = yieldLabel(rec) || `${qty} unit(s)`;
    } else if(presetSel && presetSel.value && presetSel.value!=='custom'){
      sizeDescription = presetSel.options[presetSel.selectedIndex].textContent;
    } else {
      const customEl = document.getElementById('sl-qty-custom');
      if(customEl && customEl.value){
        const unitWord = rec.yieldUnit==='piece' ? (parseFloat(customEl.value)===1?'piece':'pieces') : (rec.yieldUnit==='ml' ? 'ml' : 'g');
        sizeDescription = `${customEl.value} ${unitWord}`;
      } else {
        sizeDescription = `${qty} unit(s)`;
      }
    }

    hint.textContent = isWholeBatch
      ? `Your set price for ${sizeDescription} is ${inr(suggestedTotal)}. Cost: ${inr(costTotal)}.`
      : `Estimated price for ${sizeDescription} (based on your standard pricing): ${inr(suggestedTotal)} — adjust as needed. Cost: ${inr(costTotal)}.`;
  }

  if(recipeSel) recipeSel.addEventListener('change', renderPortionControl);
  renderPortionControl();

  // If we're editing an existing sale, populate the portion control and price
  // with that sale's actual values now that the recipe-dependent control exists.
  const editingSale = editingSaleId ? STATE.sales.find(s=>s.id===editingSaleId) : null;
  if(editingSale && !editingSale.recipeId){
    // Custom / off-menu sale — everything here is manual, just restore it directly.
    recipeSel.value = '__custom__';
    renderPortionControl();
    document.getElementById('sl-qty').value = editingSale.qty;
    const unitSel = document.getElementById('sl-custom-unit');
    if(unitSel && editingSale.portionLabel){
      const parts = editingSale.portionLabel.split(' ');
      const storedUnit = parts[1];
      const match = storedUnit==='piece'||storedUnit==='pieces' ? 'piece' : storedUnit;
      if([...unitSel.options].some(o=>o.value===match)) unitSel.value = match;
    }
    costInput.value = editingSale.cost;
    priceInput.value = editingSale.price;
  } else if(editingSale){
    const rec = STATE.recipes.find(r=>r.id===editingSale.recipeId);
    const presetSel = document.getElementById('sl-portion-preset');
    const qtyInputNow = document.getElementById('sl-qty');
    const customInputNow = document.getElementById('sl-qty-custom');
    if(presetSel){
      let matchedValue = 'custom';
      for(const opt of presetSel.options){
        if(opt.value!=='' && opt.value!=='custom' && opt.textContent===editingSale.portionLabel){
          matchedValue = opt.value; break;
        }
      }
      presetSel.value = matchedValue;
      presetSel.dispatchEvent(new Event('change'));
      if(matchedValue==='custom' && rec){
        const customEl = document.getElementById('sl-qty-custom');
        if(customEl) customEl.value = round2(customAmountFromRatio(rec, editingSale.qty));
        document.getElementById('sl-qty').value = editingSale.qty;
      }
    } else if(customInputNow && rec){
      // ml recipes: always-custom control, no preset dropdown
      customInputNow.value = round2(customAmountFromRatio(rec, editingSale.qty));
      qtyInputNow.value = editingSale.qty;
    } else if(qtyInputNow){
      // no batch size set on this recipe — plain fraction entry
      qtyInputNow.value = editingSale.qty;
    }
    recomputeLiveSuggestion();
    // Show the actual price this sale was logged at, not the freshly recomputed
    // suggestion — editing shouldn't silently swap in today's suggested price.
    priceInput.value = editingSale.price;
  }

  const cancelBtn = document.getElementById('sl-cancel-edit');
  if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ editingSaleId = null; render(); });

  document.querySelectorAll('.edit-sale').forEach(b=>b.addEventListener('click', ()=>{
    editingSaleId = b.dataset.id;
    render();
  }));

  const addBtn = document.getElementById('sl-add');
  if(addBtn) addBtn.addEventListener('click', async ()=>{
    const qtyInput = document.getElementById('sl-qty');
    const qty = parseFloat(qtyInput.value)||0;
    const price = parseFloat(priceInput.value)||0;
    let saleFields;

    if(isCustomMode()){
      const customName = customNameInput.value.trim();
      if(!customName){ await modalAlert('Give the custom item a name.'); return; }
      const cost = parseFloat(costInput.value)||0;
      const unit = document.getElementById('sl-custom-unit').value;
      const unitWord = unit==='piece' ? (qty===1?'piece':'pieces') : unit;
      saleFields = {
        date: document.getElementById('sl-date').value,
        recipeId: null,
        recipeName: customName,
        client: document.getElementById('sl-client').value.trim(),
        qty,
        portionLabel: `${qty} ${unitWord}`,
        price,
        cost,                          // entered manually — nothing calculated for custom items
        totalsPreComputed: true,
        payMethod: document.getElementById('sl-paymethod').value,
        payStatus: document.getElementById('sl-paystatus').value,
        orderStatus: document.getElementById('sl-orderstatus').value,
      };
    } else {
      const rec = STATE.recipes.find(r=>r.id===recipeSel.value);
      if(!rec){ await modalAlert('Choose a recipe.'); return; }
      const sc = saleCostAndSuggested(rec, qty);
      const presetSel = document.getElementById('sl-portion-preset');
      let portionLabel = null;
      if(presetSel && presetSel.value && presetSel.value!=='custom'){
        const opt = presetSel.options[presetSel.selectedIndex];
        portionLabel = opt.textContent;
      }
      saleFields = {
        date: document.getElementById('sl-date').value,
        recipeId: rec.id,
        recipeName: rec.name,
        client: document.getElementById('sl-client').value.trim(),
        qty,
        portionLabel,
        price,                          // total price actually charged for this sale
        cost: sc.cost,                  // ingredient cost scaled by qty + full other-costs, always automatic
        suggestedPriceAtSale: sc.suggested,
        totalsPreComputed: true,
        payMethod: document.getElementById('sl-paymethod').value,
        payStatus: document.getElementById('sl-paystatus').value,
        orderStatus: document.getElementById('sl-orderstatus').value,
      };
    }

    if(editingSaleId){
      const idx = STATE.sales.findIndex(s=>s.id===editingSaleId);
      if(idx>-1) STATE.sales[idx] = { ...STATE.sales[idx], ...saleFields };
      editingSaleId = null;
    } else {
      STATE.sales.push({ id: uid('s'), ...saleFields });
    }
    await saveKey('sales', STATE.sales);
    render();
  });
  document.querySelectorAll('.del-sale').forEach(b=>b.addEventListener('click', async ()=>{
    if(!(await modalConfirm('Remove this sale record?', 'Remove'))) return;
    STATE.sales = STATE.sales.filter(s=>s.id!==b.dataset.id);
    await saveKey('sales', STATE.sales);
    render();
  }));
}

function monthlySummary(){
  const map = {};
  STATE.sales.forEach(s=>{
    const d = s.date ? new Date(s.date) : null;
    const key = d && !isNaN(d) ? `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}` : 'Undated';
    if(!map[key]) map[key] = {key, revenue:0, cost:0, count:0};
    map[key].revenue += saleRevenue(s);
    map[key].cost += saleCost(s);
    map[key].count += 1;
  });
  const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return Object.values(map).map(m=>{
    let label = m.key;
    if(m.key!=='Undated'){
      const [y,mo] = m.key.split('-');
      label = `${monthNames[parseInt(mo)-1]} ${y}`;
    }
    return {...m, label, revenue: round2(m.revenue), cost: round2(m.cost), profit: round2(m.revenue-m.cost)};
  }).sort((a,b)=> b.key.localeCompare(a.key));
}

function readCloudForm(){
  const databaseURL = (document.getElementById('cloud-url').value||'').trim().replace(/\/$/,'');
  const code = (document.getElementById('cloud-code').value||'').trim();
  return { databaseURL, code };
}

async function attachCloudSyncHandlers(){
  const disconnectBtn = document.getElementById('cloud-disconnect-btn');
  if(disconnectBtn) disconnectBtn.addEventListener('click', async ()=>{
    if(!(await modalConfirm('Disconnect this device from cloud sync? Your data stays in the cloud workspace — this device will just go back to saving locally.', 'Disconnect'))) return;
    saveCloudConfig(null);
    window.location.reload();
  });

  const uploadBtn = document.getElementById('cloud-connect-upload');
  if(uploadBtn) uploadBtn.addEventListener('click', async ()=>{
    const cfg = readCloudForm();
    if(!cfg.databaseURL || !cfg.code){ await modalAlert('Fill in the database URL and a workspace code first.'); return; }
    uploadBtn.disabled = true; uploadBtn.innerHTML = '<span class="spinner"></span>Connecting…';
    try{
      const existing = await cloudFetchBundle(cfg);
      if(Object.keys(existing).length>0){
        if(!(await modalConfirm('This workspace code already has data in it. Uploading will overwrite it with this device\'s current data. Continue?', 'Overwrite cloud data'))) {
          uploadBtn.disabled=false; uploadBtn.textContent='Connect — upload this device\'s data'; return;
        }
      }
      const bundle = { materials: STATE.materials, settings: STATE.settings, recipes: STATE.recipes, sales: STATE.sales, purchases: STATE.purchases };
      await cloudPushBundle(cfg, bundle);
      saveCloudConfig(cfg);
      window.location.reload();
    }catch(e){
      await modalAlert(`Couldn't connect (${(e&&e.message)||'unknown error'}). Double-check the database URL and that its rules allow read/write.`);
      uploadBtn.disabled=false; uploadBtn.textContent='Connect — upload this device\'s data';
    }
  });

  const loadBtn = document.getElementById('cloud-connect-load');
  if(loadBtn) loadBtn.addEventListener('click', async ()=>{
    const cfg = readCloudForm();
    if(!cfg.databaseURL || !cfg.code){ await modalAlert('Fill in the database URL and a workspace code first.'); return; }
    loadBtn.disabled = true; loadBtn.innerHTML = '<span class="spinner"></span>Connecting…';
    try{
      const existing = await cloudFetchBundle(cfg);
      if(Object.keys(existing).length===0){
        await modalAlert('No data found for that workspace code yet. Use "upload this device\'s data" instead if this is the first device you\'re connecting.');
        loadBtn.disabled=false; loadBtn.textContent='Connect — load existing cloud data';
        return;
      }
      if(!(await modalConfirm('Load this cloud workspace\'s data? It will replace whatever is currently on this device.', 'Load cloud data'))) {
        loadBtn.disabled=false; loadBtn.textContent='Connect — load existing cloud data'; return;
      }
      saveCloudConfig(cfg);
      window.location.reload();
    }catch(e){
      await modalAlert(`Couldn't connect (${(e&&e.message)||'unknown error'}). Double-check the database URL and that its rules allow read/write.`);
      loadBtn.disabled=false; loadBtn.textContent='Connect — load existing cloud data';
    }
  });
}

function attachSettingsHandlers(){
  const saveBtn = document.getElementById('save-settings');
  if(saveBtn) saveBtn.addEventListener('click', async ()=>{
    document.querySelectorAll('.rate-input').forEach(inp=>{
      STATE.settings.rates[inp.dataset.key] = parseFloat(inp.value)||0;
    });
    STATE.settings.electricity = {
      wattage: parseFloat(document.getElementById('elec-wattage').value)||0,
      costPerKwh: parseFloat(document.getElementById('elec-cost-per-kwh').value)||0,
    };
    STATE.settings.defaultMargin = parseFloat(document.getElementById('default-margin').value)||0;
    await saveKey('settings', STATE.settings);
    render();
  });

  const exportBtn = document.getElementById('export-data-btn');
  if(exportBtn) exportBtn.addEventListener('click', ()=>{
    const backup = {
      exportedAt: new Date().toISOString(),
      materials: STATE.materials,
      settings: STATE.settings,
      recipes: STATE.recipes,
      sales: STATE.sales,
      purchases: STATE.purchases,
    };
    const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `rosies-bakehouse-backup-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });

  const importBtn = document.getElementById('import-data-btn');
  const importFile = document.getElementById('import-data-file');
  if(importBtn) importBtn.addEventListener('click', ()=> importFile.click());
  if(importFile) importFile.addEventListener('change', async ()=>{
    const file = importFile.files[0];
    if(!file) return;
    try{
      const text = await file.text();
      const backup = JSON.parse(text);
      if(!backup.materials || !backup.recipes){ await modalAlert('That file doesn\'t look like a backup from this calculator.'); return; }
      if(!(await modalConfirm('Restore from this backup? This will replace your current ingredients, recipes, sales, and purchases with what\'s in the file.', 'Restore'))) return;
      STATE.materials = backup.materials || [];
      STATE.settings = backup.settings || DEFAULT_SETTINGS;
      STATE.recipes = backup.recipes || [];
      STATE.sales = backup.sales || [];
      STATE.purchases = backup.purchases || [];
      await Promise.all([
        saveKey('materials', STATE.materials),
        saveKey('settings', STATE.settings),
        saveKey('recipes', STATE.recipes),
        saveKey('sales', STATE.sales),
        saveKey('purchases', STATE.purchases),
      ]);
      render();
      await modalAlert('Backup restored.');
    }catch(e){
      await modalAlert('Couldn\'t read that file — make sure it\'s a backup downloaded from this calculator.');
    }
  });
}

// ============ PAGE HANDLER DISPATCH ============
function attachPageHandlers(){
  switch(STATE.tab){
    case 'ingredients': attachIngredientsHandlers(); break;
    case 'recipes':
      if(editingRecipe) attachRecipeEditorHandlers();
      else attachRecipesListHandlers();
      break;
    case 'purchases': attachPurchasesHandlers(); break;
    case 'sales': attachSalesHandlers(); break;
    case 'settings': attachSettingsHandlers(); attachCloudSyncHandlers(); break;
    default: break;
  }
}

// ============ ADD RECIPE FROM PHOTO ============
function photoModalHTML(){
  return `
    <div class="modal-bg" id="photo-modal-bg">
      <div class="modal wide">
        <h3>Add recipe from a photo</h3>
        <div class="notice">Upload a photo of a recipe card or your handwritten ingredient list. Claude will read it and match ingredients to your list — you'll get a chance to check everything before it's saved.</div>
        <div class="field">
          <label>Photo</label>
          <div class="dropzone" id="photo-dropzone">
            <div id="photo-dropzone-inner">Click to choose a photo</div>
          </div>
          <input type="file" accept="image/*" id="photo-file-input" style="display:none;">
        </div>
        <div id="photo-error"></div>
        <div class="row" style="justify-content:flex-end;margin-top:16px;">
          <button class="btn btn-secondary" id="photo-cancel">Cancel</button>
          <button class="btn btn-primary" id="photo-analyze" disabled>Read photo</button>
        </div>
      </div>
    </div>
  `;
}

function openPhotoRecipeModal(){
  document.body.insertAdjacentHTML('beforeend', photoModalHTML());
  let fileData = null; // {base64, mediaType}
  const dropzone = document.getElementById('photo-dropzone');
  const fileInput = document.getElementById('photo-file-input');
  const analyzeBtn = document.getElementById('photo-analyze');
  const errBox = document.getElementById('photo-error');

  dropzone.addEventListener('click', ()=> fileInput.click());
  fileInput.addEventListener('change', ()=>{
    const file = fileInput.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      const dataUrl = reader.result;
      const [, mediaType, , b64] = dataUrl.match(/^data:(.+?)(;charset=[^;]+)?;base64,(.*)$/) || [];
      fileData = { base64: b64, mediaType };
      document.getElementById('photo-dropzone-inner').innerHTML = `<img src="${dataUrl}">`;
      analyzeBtn.disabled = false;
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('photo-cancel').addEventListener('click', ()=>{
    document.getElementById('photo-modal-bg').remove();
  });
  document.getElementById('photo-modal-bg').addEventListener('click', (e)=>{
    if(e.target.id==='photo-modal-bg') e.currentTarget.remove();
  });

  analyzeBtn.addEventListener('click', async ()=>{
    if(!fileData) return;
    analyzeBtn.disabled = true;
    analyzeBtn.innerHTML = `<span class="spinner"></span>Reading…`;
    errBox.innerHTML='';
    try{
      const draft = await analyzeRecipePhoto(fileData);
      document.getElementById('photo-modal-bg').remove();
      editingRecipe = draft;
      STATE.tab = 'recipes';
      render();
    }catch(err){
      console.error(err);
      errBox.innerHTML = `<div class="notice warn">Couldn't read that photo (${(err&&err.message)||'unknown error'}). Try a clearer or better-lit photo, or add the recipe by hand instead.</div>`;
      analyzeBtn.disabled = false;
      analyzeBtn.textContent = 'Read photo';
    }
  });
}

function normalizeName(s){ return (s||'').toLowerCase().replace(/[^a-z0-9]/g,''); }

function bestMaterialMatch(name){
  const norm = normalizeName(name);
  if(!norm) return null;
  let exact = STATE.materials.find(m=> normalizeName(m.name)===norm);
  if(exact) return exact;
  let contains = STATE.materials.find(m=> normalizeName(m.name).includes(norm) || norm.includes(normalizeName(m.name)));
  if(contains) return contains;
  return null;
}

async function analyzeRecipePhoto(fileData){
  const ingredientNames = STATE.materials.map(m=>m.name);
  const prompt = `You are reading a photo of a home baker's recipe (a recipe card, printout, or handwritten note).
Extract the recipe as JSON only — no markdown fences, no commentary, just a JSON object with this exact shape:
{"name": "recipe name as best you can tell", "yieldQty": number or null, "yieldUnit": "g|kg|ml|piece" or null, "ingredients": [{"ingredient": "ingredient name as written in the photo", "qty": number, "unit": "gram|mililitre|piece"}]}

Rules:
- yieldQty/yieldUnit is the total batch size this recipe makes (e.g. "makes one 1kg cake" -> yieldQty 1, yieldUnit "kg"; "makes 12 cupcakes" -> yieldQty 12, yieldUnit "piece"). If the photo doesn't state this, use null for both rather than guessing.
- Convert every quantity to grams for solids, millilitres for liquids, or a whole-number count for discrete items (eggs, bananas, lemons) — do not use cups, tablespoons, or teaspoons in the output; convert them to grams/millilitres using standard baking conversions.
- If a quantity is genuinely unclear, make a reasonable estimate rather than omitting the ingredient.
- Where possible, match each ingredient's name to one of these known ingredient names (use the exact spelling from this list when it's a good match): ${ingredientNames.join(', ')}.
- If an ingredient isn't in that list, just write its name as seen in the photo.
- Output only the JSON object, nothing else.`;

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      messages: [{
        role: "user",
        content: [
          { type: "image", source: { type:"base64", media_type: fileData.mediaType, data: fileData.base64 } },
          { type: "text", text: prompt }
        ]
      }]
    })
  });
  if(!response.ok) throw new Error('API error ' + response.status);
  const data = await response.json();
  const textBlock = (data.content||[]).find(b=>b.type==='text');
  if(!textBlock) throw new Error('no text in response');
  const cleaned = textBlock.text.replace(/```json|```/g,'').trim();
  let parsed;
  try{ parsed = JSON.parse(cleaned); }
  catch(e){ throw new Error('could not parse what was read'); }

  const unmatched = [];
  const ingredients = (parsed.ingredients||[]).map(ing=>{
    const match = bestMaterialMatch(ing.ingredient);
    if(!match) unmatched.push(ing.ingredient);
    return { materialId: match ? match.id : '', qty: Math.round((ing.qty||0)*100)/100, _photoName: ing.ingredient };
  });

  const draft = {
    __wasNew: true,
    id: null,
    name: parsed.name || 'New recipe from photo',
    yieldQty: (typeof parsed.yieldQty === 'number') ? parsed.yieldQty : null,
    yieldUnit: parsed.yieldUnit || 'g',
    ingredients,
    otherCosts: [],
    margin: STATE.settings.defaultMargin,
    _unmatched: unmatched,
  };
  return draft;
}
